version: '3.8'
services:
  mongodb:
    image: mongo:latest
    container_name: skillpath-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/skillpath-ai
      - JWT_SECRET=skillpath_secret_key_123
      - PORT=5000
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5000/api

volumes:
  mongo-data:
